[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "radioskysims-beam"
version = "0.1.0"
description = "RadioBeam do RadioSkySim: domínio de beam, loaders, repositório e painel de visualização."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.3",
  "xarray>=2022.3.1",
  "pandas>=2.2",
  "sqlmodel>=0.0.24",
  "panel>=1.7.0",
  "holoviews>=1.20.2",
  "hvplot>=0.10",
  "radioskysims-core",
  "radioskysims-viz",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "dask>=2025.5.1",
]

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/radioskysims_beam"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "performance: testes de desempenho (rode com -m performance)",
]
testpaths = ["tests"]
